services:
  - type: web
    name: kaizort-backend
    env: node
    rootDir: backend
    plan: free
    region: singapore
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: STOCK_ENCRYPTION_SECRET
        sync: false
      - key: FRONTEND_URL
        value: https://kizort-shop.vercel.app
      - key: FRONTEND_HEALTH_URL
        value: https://kizort-shop.vercel.app
      - key: BOT_API_KEY
        sync: false
      - key: LOW_STOCK_THRESHOLD
        value: "2"
      - key: LARGE_TOPUP_AMOUNT
        value: "2000"
      - key: TICKET_STALE_HOURS
        value: "6"
      - key: DISCORD_NOTIFY_BOT_TOKEN
        sync: false
      - key: DISCORD_OPS_BOT_TOKEN
        sync: false
      - key: DISCORD_OPS_PUBLIC_KEY
        sync: false
      - key: DISCORD_OPS_APP_ID
        sync: false
      - key: DISCORD_GUILD_ID
        sync: false
      - key: DISCORD_ADMIN_ROLE_ID
        sync: false
      - key: DISCORD_ADMIN_USER_IDS
        sync: false

  - type: web
    name: kaizort-discord-bot
    env: python
    rootDir: discord-bot
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /health
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: DATABASE_PATH
        value: data/bot.sqlite3
      - key: KEY_PREFIX
        value: FREE_
      - key: KEY_HEX_LENGTH
        value: "32"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: STOCK_ENCRYPTION_SECRET
        sync: false
      - key: BACKEND_API_URL
        value: https://kizortshop-1.onrender.com
      - key: BOT_API_KEY
        sync: false

  - type: web
    name: kaizort-frontend
    env: node
    rootDir: frontend
    plan: free
    region: singapore
    buildCommand: npm install --include=dev && npm run build
    startCommand: node .next/standalone/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: HOSTNAME
        value: 0.0.0.0
      - key: NEXT_PUBLIC_API_URL
        value: https://kizortshop-1.onrender.com/api/v1
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://kizortshop-1.onrender.com/api/v1
      - key: NEXT_PUBLIC_SUPABASE_URL
        value: https://qidraqabrlnuurnlkwko.supabase.co
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        value: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFpZHJhcWFicmxudXVybmxrd2tvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI0MDM0OTEsImV4cCI6MjEwNzk3OTQ5MX0.TtueyqjsoThVmBR9pHuzCcvxfM5uCk6TSGBwIamdTgA
